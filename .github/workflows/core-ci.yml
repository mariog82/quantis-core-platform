name: core-ci

on:
  push:
  pull_request:

jobs:
  core-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy . || true

      - name: Core tests
        run: python -m pytest tests/core
