name: m7-wp1-pr9-semantic-layer
on: [push, pull_request]
jobs:
  semantic-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - run: ruff check .
      - run: python -m quantis version
      - run: python -m pytest tests/core/knowledge_graph/semantic --cache-clear --import-mode=importlib
      - run: python -m pytest tests/core/knowledge_graph --cache-clear --import-mode=importlib
      - run: python -m pytest tests/release/current --cache-clear --import-mode=importlib
      - run: python -m pytest --cache-clear --import-mode=importlib
