name: m5-beta-freeze-ci

on:
  push:
  pull_request:

jobs:
  m5-beta-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy
      - name: Ruff
        run: ruff check .
      - name: M5 stabilization
        run: python -m pytest tests/framework/adapters/stabilization
      - name: SDK tests
        run: python -m pytest tests/sdk
