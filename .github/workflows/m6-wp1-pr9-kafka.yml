name: m6-wp1-pr9-kafka

on:
  push:
  pull_request:

jobs:
  kafka:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Kafka tests
        run: python -m pytest tests/core/event/kafka --cache-clear --import-mode=importlib

      - name: Event Doctor
        run: python -m tools.event_doctor.cli

      - name: Full test suite
        run: python -m pytest --cache-clear --import-mode=importlib
