name: repository-audit-ci

on:
  push:
  pull_request:

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Repository audit
        run: python -m tools.repository_audit.cli

      - name: Repository audit tests
        run: python -m pytest tests/tools/repository_audit
