name: m7-wp1-pr10-freeze
on:
  push:
  pull_request:
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - run: ruff check .
      - run: python -m tools.m7_wp1_freeze.cli
      - run: python -m pytest --cache-clear --import-mode=importlib
