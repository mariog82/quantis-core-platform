name: m7-wp1-pr3-relationship-engine

on:
  push:
  pull_request:

jobs:
  relationship-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Official version command
        run: python -m quantis version

      - name: CLI tests
        run: python -m pytest tests/quantis --cache-clear --import-mode=importlib

      - name: Relationship Engine tests
        run: python -m pytest tests/core/knowledge_graph/relationship_engine --cache-clear --import-mode=importlib

      - name: Knowledge Graph tests
        run: python -m pytest tests/core/knowledge_graph --cache-clear --import-mode=importlib

      - name: Current release gates
        run: python -m pytest tests/release/current --cache-clear --import-mode=importlib

      - name: Full test suite
        run: python -m pytest --cache-clear --import-mode=importlib
