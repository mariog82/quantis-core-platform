name: m6-wp4-pr3-state-machine

on:
  push:
  pull_request:

jobs:
  state-machine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Ruff
        run: ruff check .

      - name: State Machine tests
        run: python -m pytest tests/core/workflow2/state_machine --cache-clear --import-mode=importlib

      - name: Workflow tests
        run: python -m pytest tests/core/workflow2 --cache-clear --import-mode=importlib

      - name: Full test suite
        run: python -m pytest --cache-clear --import-mode=importlib
