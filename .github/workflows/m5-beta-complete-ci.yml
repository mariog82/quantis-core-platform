name: m5-beta-complete-ci

on:
  push:
  pull_request:

jobs:
  m5-beta-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest ruff mypy
      - run: ruff check .
      - run: python -m pytest tests/framework/adapters/stabilization tests/sdk tests/framework/adapters/sdk tests/services/stabilization
