name: quantis-ci

on:
  push:
  pull_request:

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy coverage

      - name: Ruff
        run: ruff check .

      - name: Repository Integrity
        run: python -m tools.repository_integrity.cli

      - name: Test Integrity
        run: python -m tools.test_integrity.cli

      - name: Public API Integrity
        run: python -m tools.public_api_integrity.cli

      - name: Unit Tests
        run: |
          python -m pytest tests/tools/repository_integrity
          python -m pytest tests/tools/test_integrity
          python -m pytest tests/tools/public_api_integrity
          python -m pytest tests/framework/adapters/stabilization

      - name: Full Test Suite
        run: python -m pytest tests/core tests/framework tests/modules tests/services tests/sdk tests/tools
