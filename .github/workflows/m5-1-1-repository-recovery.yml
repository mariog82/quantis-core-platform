name: m5-1-1-repository-recovery

on:
  push:
  pull_request:

jobs:
  repository-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - name: Ruff
        run: ruff check .
      - name: Recovery cleanup
        run: python -m tools.repository_recovery.cli
      - name: Integrity gates
        run: |
          python -m tools.repository_integrity.cli
          python -m tools.test_integrity.cli
          python -m tools.public_api_integrity.cli
          python -m tools.ci_stabilization.cli
          python -m tools.release_manager.cli
          python -m tools.repository_audit.cli
      - name: Recovery tests
        run: python -m pytest tests/tools
