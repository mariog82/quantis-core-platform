name: modules-ci

on:
  push:
  pull_request:

jobs:
  modules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Modules tests
        run: python -m pytest tests/modules
