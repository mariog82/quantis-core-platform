name: m5-2-release-candidate

on:
  push:
  pull_request:

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff build
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: python -m pytest --cache-clear --import-mode=importlib
      - name: Current release gates
        run: python -m pytest tests/release/current --cache-clear --import-mode=importlib
      - name: Repository gates
        run: |
          python -m tools.release_gates.cli
          python -m tools.repository_integrity.cli
          python -m tools.test_integrity.cli
          python -m tools.public_api_integrity.cli
          python -m tools.ci_stabilization.cli
          python -m tools.release_manager.cli
          python -m tools.repository_audit.cli
      - name: Build package
        run: python -m build
