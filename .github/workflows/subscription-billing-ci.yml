name: subscription-billing-ci

on:
  push:
  pull_request:

jobs:
  subscription-billing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Subscription and billing tests
        run: python -m pytest tests/services/subscription tests/services/billing tests/services/integration
