name: m6-wp4-pr7-saga-engine

on:
  push:
  pull_request:

jobs:
  saga-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Saga tests
        run: python -m pytest tests/core/workflow2/saga --cache-clear --import-mode=importlib

      - name: Workflow tests
        run: python -m pytest tests/core/workflow2 --cache-clear --import-mode=importlib

      - name: Full test suite
        run: python -m pytest --cache-clear --import-mode=importlib
