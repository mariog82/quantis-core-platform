name: m5-1-ci-stabilization

on:
  push:
  pull_request:

jobs:
  m5-1-stabilization:
    name: M5.1 Stabilization
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy coverage

      - name: Ruff
        run: ruff check .

      - name: Run M5.1 gates
        run: |
          python -m tools.repository_integrity.cli
          python -m tools.test_integrity.cli
          python -m tools.public_api_integrity.cli

      - name: Run M5.1 tests
        run: |
          python -m pytest tests/tools/repository_integrity
          python -m pytest tests/tools/test_integrity
          python -m pytest tests/tools/public_api_integrity
          python -m pytest tests/framework/adapters/stabilization
