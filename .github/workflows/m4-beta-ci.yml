name: m4-beta-ci

on:
  push:
  pull_request:

jobs:
  m4-beta-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Core framework modules and services tests
        run: python -m pytest tests/core tests/framework tests/modules tests/services
      - name: Enterprise services integration tests
        run: python -m pytest tests/services/integration
      - name: Enterprise services stabilization tests
        run: python -m pytest tests/services/stabilization
