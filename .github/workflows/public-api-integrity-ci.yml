name: public-api-integrity-ci

on:
  push:
  pull_request:

jobs:
  public-api-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - name: Ruff
        run: ruff check .
      - name: Public API integrity checks
        run: python -m tools.public_api_integrity.cli
      - name: Public API integrity tests
        run: python -m pytest tests/tools/public_api_integrity
